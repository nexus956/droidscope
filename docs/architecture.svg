<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <rect width="880" height="470" rx="12" fill="#0d1117"/>

  <!-- title -->
  <text x="440" y="44" text-anchor="middle" fill="#f0f6fc" font-size="21" font-weight="700">MitmDroid — Android MITM Lab</text>
  <text x="440" y="68" text-anchor="middle" fill="#8b949e" font-size="13">near-native Android in a container · pins killed at runtime · everything in Burp</text>

  <!-- host box -->
  <rect x="42" y="100" width="290" height="300" rx="10" fill="#161b22" stroke="#58a6ff" stroke-width="1.5"/>
  <text x="187" y="130" text-anchor="middle" fill="#58a6ff" font-size="16" font-weight="700">KALI LINUX HOST</text>
  <line x1="62" y1="144" x2="312" y2="144" stroke="#21262d" stroke-width="1"/>

  <text x="62" y="172" fill="#f0f6fc" font-size="13" font-weight="600">Burp Suite</text>
  <text x="62" y="189" fill="#8b949e" font-size="12">proxy listener :8080 — system CA</text>

  <text x="62" y="222" fill="#f0f6fc" font-size="13" font-weight="600">frida CLI 17.x</text>
  <text x="62" y="239" fill="#8b949e" font-size="12">frida -U attach · scripts chained</text>

  <text x="62" y="272" fill="#f0f6fc" font-size="13" font-weight="600">adb client</text>
  <text x="62" y="289" fill="#8b949e" font-size="12">connect 192.168.240.112:5555</text>

  <text x="62" y="322" fill="#f0f6fc" font-size="13" font-weight="600">waydroid tooling</text>
  <text x="62" y="339" fill="#8b949e" font-size="12">keepalive unfreeze loop</text>

  <!-- container box -->
  <rect x="548" y="100" width="290" height="300" rx="10" fill="#161b22" stroke="#3fb950" stroke-width="1.5"/>
  <text x="693" y="130" text-anchor="middle" fill="#3fb950" font-size="16" font-weight="700">WAYDROID CONTAINER</text>
  <line x1="568" y1="144" x2="818" y2="144" stroke="#21262d" stroke-width="1"/>

  <text x="568" y="172" fill="#f0f6fc" font-size="13" font-weight="600">Android 13 — LineageOS 20</text>
  <text x="568" y="189" fill="#8b949e" font-size="12">GAPPS · Pixel-7 identity spoofed</text>

  <text x="568" y="222" fill="#f0f6fc" font-size="13" font-weight="600">frida-server (root)</text>
  <text x="568" y="239" fill="#8b949e" font-size="12">x86_64 build — arch-matched</text>

  <text x="568" y="272" fill="#f0f6fc" font-size="13" font-weight="600">target app</text>
  <text x="568" y="289" fill="#8b949e" font-size="12">pinned TLS — hooks force-accept</text>

  <text x="568" y="322" fill="#f0f6fc" font-size="13" font-weight="600">system CA store</text>
  <text x="568" y="339" fill="#8b949e" font-size="12">Burp CA installed — silent trust</text>

  <!-- arrow 1: adb/frida host -> container -->
  <defs>
    <marker id="ah" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 z" fill="#58a6ff"/>
    </marker>
    <marker id="ag" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 z" fill="#3fb950"/>
    </marker>
    <marker id="ao" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 z" fill="#d29922"/>
    </marker>
  </defs>

  <line x1="332" y1="190" x2="548" y2="190" stroke="#58a6ff" stroke-width="1.5" marker-end="url(#ah)"/>
  <text x="440" y="182" text-anchor="middle" fill="#58a6ff" font-size="11.5">frida -U attach · pinning bypass · proxy override</text>

  <line x1="332" y1="250" x2="548" y2="250" stroke="#58a6ff" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#ah)"/>
  <text x="440" y="242" text-anchor="middle" fill="#8b949e" font-size="11.5">adb shell · am start · settings · install</text>

  <!-- arrow 2: app traffic -> burp -->
  <line x1="548" y1="300" x2="332" y2="300" stroke="#3fb950" stroke-width="1.5" marker-end="url(#ag)"/>
  <text x="440" y="292" text-anchor="middle" fill="#3fb950" font-size="11.5">app traffic → http_proxy → Burp MITM</text>

  <!-- burp to internet -->
  <line x1="187" y1="100" x2="187" y2="60" stroke="#d29922" stroke-width="1.5" marker-end="url(#ao)"/>
  <text x="200" y="82" fill="#d29922" font-size="11.5">decrypted in HTTP history</text>

  <!-- caption -->
  <text x="440" y="436" text-anchor="middle" fill="#6e7681" font-size="11.5">no emulator — LXC on the host kernel · root via waydroid shell (adb root is blocked by the image, irrelevant)</text>
</svg>
